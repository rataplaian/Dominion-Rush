name: Dominion Rush Web Preview

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build-web:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Configure GitHub Pages
        uses: actions/configure-pages@v5

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install dependencies
        run: npm install

      - name: Export Expo web build
        run: npm run export:web

      - name: Browser smoke test
        shell: bash
        run: |
          rm -rf .smoke-root
          mkdir -p .smoke-root/Dominion-Rush
          cp -R dist/. .smoke-root/Dominion-Rush/
          npx --yes serve .smoke-root -l 4173 > /tmp/dominion-serve.log 2>&1 &
          SERVER_PID=$!
          trap "kill $SERVER_PID || true" EXIT
          sleep 3

          CHROME_BIN="$(command -v google-chrome || command -v google-chrome-stable || command -v chromium || command -v chromium-browser || true)"
          if [ -z "$CHROME_BIN" ]; then
            echo "No Chromium-compatible browser found on runner."
            exit 1
          fi

          "$CHROME_BIN"             --headless             --no-sandbox             --disable-gpu             --enable-logging=stderr             --v=0             --virtual-time-budget=4000             --dump-dom             http://127.0.0.1:4173/Dominion-Rush/             > /tmp/dominion-dom.html             2> /tmp/dominion-chrome.log || true

          echo "---- Browser log ----"
          cat /tmp/dominion-chrome.log || true
          echo "---- Rendered DOM ----"
          head -c 12000 /tmp/dominion-dom.html || true
          echo

          grep -q "Dominion Rush" /tmp/dominion-dom.html
          grep -q "GIOCA" /tmp/dominion-dom.html

      - name: Preserve preview artifact
        uses: actions/upload-artifact@v4
        with:
          name: dominion-rush-web-preview
          path: dist
          retention-days: 14

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v4
        with:
          path: dist

  deploy-pages:
    needs: build-web
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4

      - name: Verify live mobile preview
        shell: bash
        run: |
          sleep 3
          URL="https://rataplaian.github.io/Dominion-Rush/?build=${GITHUB_SHA}"
          CHROME_BIN="$(command -v google-chrome || command -v google-chrome-stable || command -v chromium || command -v chromium-browser || true)"
          if [ -z "$CHROME_BIN" ]; then
            echo "No Chromium-compatible browser found on runner."
            exit 1
          fi

          "$CHROME_BIN" \
            --headless \
            --no-sandbox \
            --disable-gpu \
            --window-size=390,844 \
            --virtual-time-budget=5000 \
            --dump-dom \
            "$URL" \
            > /tmp/dominion-live-dom.html \
            2> /tmp/dominion-live-browser.log || true

          cat /tmp/dominion-live-browser.log || true
          grep -q "Dominion Rush" /tmp/dominion-live-dom.html
          grep -q "GIOCA" /tmp/dominion-live-dom.html
